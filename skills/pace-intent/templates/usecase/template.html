<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@TITLE@</title>
<style>
/*@BASE_CSS@*/
.uc{margin-bottom:16px}
.uc-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.uc-head h3{font-size:16px}
.meta-grid{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.meta-grid dt{color:var(--muted);font-size:12px;padding-top:2px}.meta-grid dd{margin:0}
.steps td:first-child{width:44px;color:var(--faint);font-variant-numeric:tabular-nums}
.steps td:last-child{width:110px;text-align:right}
.kind{font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px}
.kind.예외{background:var(--warn-soft);color:var(--warn)}.kind.대안{background:var(--surface-2);color:var(--muted)}
.blk{padding:12px 18px}
.actor{padding:6px 10px}
.diagram{margin-bottom:16px}
.diagram svg{display:block;width:100%;height:auto}
.diagram text{font-family:inherit;fill:var(--text)}
.ucd-boundary{fill:var(--surface-2);stroke:var(--line-2);stroke-width:1.2}
.ucd-title{font-size:12px;font-weight:700;fill:var(--muted)}
.ucd-uc ellipse{fill:var(--surface);stroke:var(--line-2);stroke-width:1.4}
.ucd-uc:hover ellipse,.ucd-uc.hl ellipse{stroke:var(--accent);fill:var(--accent-soft)}
.ucd-uc .uid{font-size:10px;font-weight:700;fill:var(--accent)}
.ucd-actor{stroke:var(--text);stroke-width:1.6;fill:none}
.ucd-actor-ext{stroke:var(--muted);stroke-dasharray:3 2}
.ucd-line{stroke:var(--faint);stroke-width:1.2}
.ucd-line.hl{stroke:var(--accent);stroke-width:2}
.ucd-rel{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 3;fill:none}
.ucd-legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;padding:0 18px 14px}
</style>
</head>
<body>
<script type="application/json" id="pace-data">
@DATA@
</script>
<script>
/*@BASE_JS@*/
header('유스케이스', [[ '행위자 ' + DATA.actors.length ], [ '유스케이스 ' + DATA.usecases.length ]]);
const actorName = Object.fromEntries(DATA.actors.map(a=>[a.id,a.name]));
const side = el('aside', {class:'side'},
  el('div', {class:'card pad', style:'margin-bottom:12px'}, el('h2', {class:'sec-title'}, '행위자'),
    DATA.actors.map(a => el('div', {class:'actor', id:a.id}, el('b', {}, '● ' + a.name), el('div', {class:'faint small'}, a.desc)))),
  el('div', {class:'card pad'}, el('h2', {class:'sec-title'}, '유스케이스'),
    DATA.usecases.map(u => el('a', {class:'item', href:'#'+u.id}, el('span', {class:'id'}, u.id), u.name))));
// 유스케이스 다이어그램: 행위자·유스케이스 데이터에서 배치를 계산한다(추가 데이터 없음)
function diagram(){
  const UCS = DATA.usecases, REL = DATA.relations || [];
  const primary = new Set(UCS.map(u=>u.actor));
  const meanIdx = a => { const ix = UCS.map((u,i)=>[u.actor, ...u.secondary].includes(a.id) ? i : -1).filter(i=>i>=0); return ix.reduce((s,i)=>s+i,0)/(ix.length||1); };
  const left = DATA.actors.filter(a=>primary.has(a.id)), right = DATA.actors.filter(a=>!primary.has(a.id)).sort((a,b)=>meanIdx(a)-meanIdx(b));
  const Wd = 860, top = 56, gap = 74, EW = 220, EH = 48;
  const Hd = top + UCS.length*gap + 10, cx = Wd/2, bx = cx - 190, bw = 380;
  const ucPos = Object.fromEntries(UCS.map((u,i)=>[u.id, {x:cx, y:top + i*gap + EH/2}]));
  const place = (list, x) => Object.fromEntries(list.map((a,i)=>[a.id, {x, y: Hd/(list.length+1)*(i+1)}]));
  const actPos = {...place(left, 90), ...place(right, Wd-90)};
  const svg = el('svg:svg', {viewBox:'0 0 ' + Wd + ' ' + Hd, role:'img', 'aria-label':'유스케이스 다이어그램'});
  svg.append(el('svg:defs', {}, el('svg:marker', {id:'ucarr', viewBox:'0 0 10 10', refX:9, refY:5, markerWidth:7, markerHeight:7, orient:'auto'},
    el('svg:path', {d:'M0,0 L10,5 L0,10', style:'fill:none;stroke:var(--muted);stroke-width:1.5'}))));
  svg.append(el('svg:rect', {class:'ucd-boundary', x:bx, y:14, width:bw, height:Hd-24, rx:12}),
    el('svg:text', {class:'ucd-title', x:bx+14, y:34}, DATA.doc.project));
  const lines = [];
  for (const u of UCS) for (const a of [u.actor, ...u.secondary]){
    const p = actPos[a], q = ucPos[u.id], side = p.x < cx ? -1 : 1;
    const ln = el('svg:line', {class:'ucd-line', 'data-uc':u.id, x1:p.x - side*18, y1:p.y - 6, x2:q.x + side*EW/2, y2:q.y});
    lines.push(ln); svg.append(ln);
  }
  for (const r of REL){
    const a = ucPos[r.from], b = ucPos[r.to], dx = 150;
    svg.append(el('svg:path', {class:'ucd-rel', d:'M'+(a.x+EW/2)+','+a.y+' C'+(a.x+EW/2+dx)+','+a.y+' '+(b.x+EW/2+dx)+','+b.y+' '+(b.x+EW/2)+','+b.y, 'marker-end':'url(#ucarr)'}),
      el('svg:text', {x:cx+EW/2+dx*0.62, y:(a.y+b.y)/2+4, style:'font-size:11px;fill:var(--muted)'}, '«' + r.type + '»'));
  }
  const hl = (id,on) => { lines.forEach(l=>l.classList.toggle('hl', on && l.dataset.uc===id)); svg.querySelector('[data-id="'+id+'"]').classList.toggle('hl', on); };
  for (const u of UCS){
    const q = ucPos[u.id];
    svg.append(el('svg:a', {href:'#'+u.id, class:'ucd-uc', 'data-id':u.id, onmouseenter:()=>hl(u.id,true), onmouseleave:()=>hl(u.id,false)},
      el('svg:ellipse', {cx:q.x, cy:q.y, rx:EW/2, ry:EH/2}),
      el('svg:text', {class:'uid', x:q.x, y:q.y-6, 'text-anchor':'middle'}, u.id),
      el('svg:text', {x:q.x, y:q.y+12, 'text-anchor':'middle', style:'font-size:13px'}, u.name)));
  }
  for (const a of DATA.actors){
    const {x,y} = actPos[a.id], ext = !primary.has(a.id) ? ' ucd-actor-ext' : '';
    svg.append(el('svg:g', {class:'ucd-actor' + ext},
      el('svg:circle', {cx:x, cy:y-30, r:9}), el('svg:line', {x1:x, y1:y-21, x2:x, y2:y+2}),
      el('svg:line', {x1:x-14, y1:y-12, x2:x+14, y2:y-12}), el('svg:line', {x1:x, y1:y+2, x2:x-11, y2:y+20}), el('svg:line', {x1:x, y1:y+2, x2:x+11, y2:y+20})),
      el('svg:text', {x, y:y+38, 'text-anchor':'middle', style:'font-size:12px;font-weight:600'}, a.name),
      el('svg:text', {x, y:y+53, 'text-anchor':'middle', style:'font-size:10px;fill:var(--faint)'}, primary.has(a.id) ? '주 행위자' : '외부 시스템'));
  }
  return el('section', {class:'card diagram'},
    el('div', {class:'uc-head'}, el('h3', {}, '유스케이스 다이어그램'), el('span', {class:'muted small'}, '타원을 누르면 상세로 이동')),
    el('div', {class:'pad'}, svg),
    el('div', {class:'ucd-legend'}, ['🧍 주 행위자(왼쪽)', '┄ 외부 시스템(오른쪽)', '⬭ 유스케이스', '┄› «include»·«extend»(있을 때)'].map(t=>el('span', {}, t))));
}
const list = el('div', {}, diagram(), DATA.usecases.map(u => el('section', {class:'card uc', id:u.id},
  el('div', {class:'uc-head'}, el('span', {class:'id'}, u.id), el('h3', {}, u.name)),
  el('dl', {class:'meta-grid'},
    el('dt', {}, '주 행위자'), el('dd', {}, actorName[u.actor] + (u.secondary.length ? ' · 보조: ' + u.secondary.map(s=>actorName[s]).join(', ') : '')),
    el('dt', {}, '목표'), el('dd', {}, u.goal),
    el('dt', {}, '사전 조건'), el('dd', {}, u.pre.join(' · ') || '—'),
    el('dt', {}, '사후 조건'), el('dd', {}, u.post.join(' · ') || '—')),
  el('div', {class:'blk'}, el('h2', {class:'sec-title'}, '기본 흐름'),
    el('table', {class:'steps'}, el('tbody', {}, u.steps.map(s => el('tr', {}, el('td', {}, s.n + '.'), el('td', {}, s.text), el('td', {}, idLink(s.screen))))))),
  el('div', {class:'blk'}, el('h2', {class:'sec-title'}, '대안·예외 흐름'),
    el('table', {class:'steps'}, el('tbody', {}, u.alts.map(a => el('tr', {},
      el('td', {}, a.id), el('td', {}, el('span', {class:'kind ' + a.kind}, a.kind), ' ', a.text, a.ac ? null : el('div', {class:'warnline'}, '⚠ 완료 기준 없음')),
      el('td', {}, idLink(a.screen), ' ', a.ac ? idLink(a.ac) : null)))))),
  el('div', {class:'blk', style:'border-top:1px solid var(--line)'}, el('span', {class:'muted small'}, '관련 기능 '), ids(u.features),
    u.sequence ? el('span', {class:'muted small', style:'margin-left:16px'}, '시퀀스 ', (Object.hasOwn(DATA.sequenceOf, u.id) ? idLink(DATA.sequenceOf[u.id]) : '시퀀스 없음'), ' — ' + u.sequence) : null)
)));
document.body.append(el('main', {class:'wrap'}, el('div', {class:'grid2'}, side, list))); footer();
</script>
</body>
</html>
