<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쇼츠 자동 발행 서비스 · 사용자 흐름</title>
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f0f2f5; --line:#dde1e7; --line-2:#c9cfd8;
  --text:#1b1f24; --muted:#5d6672; --faint:#8a929d;
  --accent:#2f5bea; --accent-soft:#e8eefe; --ok:#1f8a4c; --ok-soft:#e5f5ec; --warn:#b26a00; --warn-soft:#fff3dc;
  --wf-fill:#e6e8ec; --wf-stroke:#b8bec7; --wf-ink:#4a525c; --wf-screen:#ffffff;
  --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111418; --surface:#181c21; --surface-2:#20252c; --line:#2c323a; --line-2:#3a414b;
    --text:#e7eaee; --muted:#a3abb6; --faint:#77808b;
    --accent:#7d9cff; --accent-soft:#1e2742; --ok:#4cc38a; --ok-soft:#173226; --warn:#f0b04c; --warn-soft:#3a2c12;
    --wf-fill:#2a3038; --wf-stroke:#4a525d; --wf-ink:#c4cad3; --wf-screen:#1d2228;
    --shadow:none; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111418; --surface:#181c21; --surface-2:#20252c; --line:#2c323a; --line-2:#3a414b;
  --text:#e7eaee; --muted:#a3abb6; --faint:#77808b;
  --accent:#7d9cff; --accent-soft:#1e2742; --ok:#4cc38a; --ok-soft:#173226; --warn:#f0b04c; --warn-soft:#3a2c12;
  --wf-fill:#2a3038; --wf-stroke:#4a525d; --wf-ink:#c4cad3; --wf-screen:#1d2228;
  --shadow:none; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
h1,h2,h3{margin:0;line-height:1.3}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .row1{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:14px 0 6px}
.top .proj{font-weight:700;font-size:16px}
.top .kind{color:var(--muted);font-size:16px}
.top .meta{margin-left:auto;color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding-bottom:0;scrollbar-width:none}
nav.tabs a{padding:8px 12px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-size:13px}
nav.tabs a:hover{color:var(--text);text-decoration:none}
nav.tabs a.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.badges{display:flex;gap:6px;flex-wrap:wrap;padding:8px 0 12px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
main.wrap{padding-top:20px;padding-bottom:60px}
.checks{padding-left:0;list-style:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px}
.id{display:inline-block;font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;padding:3px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
a.id:hover{text-decoration:none;filter:brightness(1.1)}
.id.plain{background:var(--surface-2);color:var(--muted)}
.ids{display:inline-flex;gap:4px;flex-wrap:wrap}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface-2)}
.sec-title{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:0 0 8px}
.grid2{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start}
.side{position:sticky;top:132px}
.side a.item{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:8px;color:var(--text)}
.side a.item:hover{background:var(--surface-2);text-decoration:none}
.side a.item.on{background:var(--accent-soft)}
:target{scroll-margin-top:140px}
.warnline{color:var(--warn);font-size:12px}
.okline{color:var(--ok);font-size:12px}
.st{display:inline-block;font-size:11px;padding:1px 6px;border-radius:99px;margin-left:4px;border:1px solid var(--line)}
.st-기존{background:var(--surface-2);color:var(--muted)}
.st-변경{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.st-신규{background:var(--accent-soft);color:var(--accent);border-color:transparent}
li,td,dd{overflow-wrap:anywhere}
footer.foot{color:var(--faint);font-size:12px;padding:24px 0;border-top:1px solid var(--line)}
@media (max-width: 760px){
  table{display:block;overflow-x:auto}
  .grid2{grid-template-columns:1fr}
  .side{position:static}
  .top .meta{margin-left:0;width:100%}
}
@media print{
  header.top{position:static;backdrop-filter:none}
  nav.tabs,.noprint,select,.seg{display:none}
  body{background:#fff}
  .card{box-shadow:none;break-inside:avoid}
}

.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.seg button{font:inherit;padding:6px 12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
.seg button.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.canvas{overflow-x:auto;padding:18px}
svg text{font-family:inherit;fill:var(--text)}
.n-screen rect{fill:var(--surface);stroke:var(--line-2);stroke-width:1.2}
.n-screen:hover rect{stroke:var(--accent)}
.n-state rect{fill:var(--warn-soft);stroke:var(--warn);stroke-dasharray:4 3}
.n-decision polygon{fill:var(--surface-2);stroke:var(--line-2)}
.n-term rect{fill:var(--text)} .n-term text{fill:var(--bg)}
.edge{fill:none;stroke:var(--faint);stroke-width:1.4}
.elabel{font-size:11px;fill:var(--muted)}
.elabel-bg{fill:var(--bg)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:10px}
</style>
</head>
<body>
<script type="application/json" id="pace-data">
{"doc":{"project":"쇼츠 자동 발행 서비스","version":"v0.1","date":"2026-10-29","depth":"L2","source":"pace-intent 템플릿 예시 · 쇼츠 자동 발행 서비스"},"nav":{"docs":[["index.html","목차"],["usecase.html","유스케이스"],["ia.html","IA"],["flow.html","사용자 흐름"],["sequence.html","시퀀스"],["wireframe.html","와이어프레임"],["spec.html","기능 명세"]],"route":{"UC":"usecase.html","A":"usecase.html","SCR":"ia.html","FL":"flow.html","SQ":"sequence.html","C":"sequence.html","F":"spec.html","AC":"spec.html"}},"flows":[{"id":"FL-01","name":"기획에서 발행까지","usecases":["UC-01","UC-02","UC-03"],"nodes":[{"id":"s","type":"start","label":"시작","col":0,"row":0},{"id":"n2","type":"screen","screen":"SCR-02","label":"주제 입력","col":1,"row":0},{"id":"n3","type":"screen","screen":"SCR-03","label":"기획안 목록","col":2,"row":0},{"id":"e1","type":"state","label":"생성 실패 안내","col":2,"row":1},{"id":"n4","type":"screen","screen":"SCR-04","label":"편집기","col":3,"row":0},{"id":"d1","type":"decision","label":"채널 연결됨?","col":3,"row":1},{"id":"n7","type":"screen","screen":"SCR-07","label":"채널 연결","col":4,"row":1},{"id":"n5","type":"screen","screen":"SCR-05","label":"발행","col":3,"row":2},{"id":"end","type":"end","label":"게시·예약 완료","col":3,"row":3}],"edges":[{"from":"s","to":"n2"},{"from":"n2","to":"n3","label":"만들기"},{"from":"n3","to":"e1","label":"실패"},{"from":"e1","to":"n2","label":"다시 시도","route":"hv"},{"from":"n3","to":"n4","label":"선택"},{"from":"n4","to":"d1","label":"저장"},{"from":"d1","to":"n7","label":"아니오"},{"from":"n7","to":"n5","label":"연결 완료","route":"vh"},{"from":"d1","to":"n5","label":"예"},{"from":"n5","to":"end","label":"발행"}]},{"id":"FL-02","name":"성과 확인","usecases":["UC-04"],"nodes":[{"id":"s","type":"start","label":"시작","col":0,"row":0},{"id":"n1","type":"screen","screen":"SCR-01","label":"홈","col":1,"row":0},{"id":"n6","type":"screen","screen":"SCR-06","label":"성과","col":2,"row":0},{"id":"d1","type":"decision","label":"데이터 있음?","col":3,"row":0},{"id":"empty","type":"state","label":"빈 상태 안내","col":3,"row":1},{"id":"next","type":"end","label":"FL-01로 이어짐","col":2,"row":1},{"id":"end","type":"end","label":"다음 주제 결정","col":4,"row":0}],"edges":[{"from":"s","to":"n1"},{"from":"n1","to":"n6","label":"성과 탭"},{"from":"n6","to":"d1"},{"from":"d1","to":"end","label":"예"},{"from":"d1","to":"empty","label":"아니오"},{"from":"empty","to":"next","label":"새 쇼츠"}]}],"deadEnds":0,"status":{"SCR-01":"신규","SCR-02":"신규","SCR-03":"신규","SCR-04":"신규","SCR-05":"신규","SCR-06":"신규","SCR-07":"신규"}}
</script>
<script>
const DATA = JSON.parse(document.getElementById('pace-data').textContent);
const DOCS = DATA.nav.docs;
const ROUTE = DATA.nav.route;
function el(tag, attrs, ...kids){
  const n = document.createElementNS(tag.startsWith('svg:') ? 'http://www.w3.org/2000/svg' : 'http://www.w3.org/1999/xhtml', tag.replace('svg:',''));
  for (const [k,v] of Object.entries(attrs||{})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') n.setAttribute('class', v);
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : String(v));
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) n.append(k.nodeType ? k : document.createTextNode(String(k)));
  return n;
}
// ID 접두어 → 문서 파일은 템플릿 폴더(schema.json x-pace.ids)에서 명령이 만든다. 문서끼리는 이 경로로만 잇는다.
function hrefFor(id){
  const prefix = String(id).split('-')[0];
  const file = Object.hasOwn(ROUTE, prefix) ? ROUTE[prefix] : null;
  const here = location.pathname.split('/').pop() || 'index.html';
  return file ? (file === here ? '' : file) + '#' + id : null;
}
function docHref(kind, id){ return DOCS.some(([f]) => f === kind + '.html') ? kind + '.html#' + id : null; }
// 외부 링크는 http(s)만 — 다른 스킴은 링크로 만들지 않는다.
function safeUrl(u){ return /^https?:\/\//i.test(String(u || '')) ? String(u) : null; }
function statusBadge(s){ return s && s.status ? el('span', {class:'st st-' + s.status, title:s.evidence || ''}, s.status) : null; }
function idLink(id){
  if (!id) return null;
  const href = hrefFor(id);
  if (href === null) return el('span', {class:'id plain'}, id);
  return el('a', {class:'id', href, title:id}, id);
}
function ids(list){ return el('span', {class:'ids'}, (list||[]).map(idLink)); }
function header(kind, badges){
  const d = DATA.doc, here = location.pathname.split('/').pop() || 'index.html';
  document.title = d.project + ' · ' + kind;
  const h = el('header', {class:'top'}, el('div', {class:'wrap'},
    el('div', {class:'row1'},
      el('span', {class:'proj'}, d.project),
      el('span', {class:'kind'}, '· ' + kind),
      el('span', {class:'meta'}, d.version + ' · ' + d.date + ' · 깊이 ' + d.depth + ' · ' + d.source)),
    el('nav', {class:'tabs'}, DOCS.map(([f, t]) => el('a', {href:f, class: f === here ? 'on' : null}, t))),
    el('div', {class:'badges'}, (badges||[]).map(([t, cls]) => el('span', {class:'badge ' + (cls||'')}, t)))
  ));
  document.body.prepend(h);
}
function footer(){
  document.body.append(el('footer', {class:'foot'}, el('div', {class:'wrap'},
    'pace-intent 템플릿 · 데이터는 이 파일 안 pace-data 데이터 블록(JSON)에 있고, 화면은 그 데이터로 그립니다.')));
}

header('사용자 흐름', [[ '흐름 ' + DATA.flows.length ], [ '막다른 길 ' + DATA.deadEnds, DATA.deadEnds ? 'warn' : 'ok' ]]);
const W=150,H=54,GX=200,GY=112,P=40;
const main = el('main', {class:'wrap'});
const seg = el('div', {class:'seg'});
const ucs = el('span', {class:'muted small'});
const canvas = el('div', {class:'card canvas'});
main.append(el('div', {class:'toolbar'}, seg, ucs), canvas,
  el('div', {class:'legend'}, ['▭ 화면(누르면 IA)', '◇ 분기', '⬭ 시작·끝', '┅ 상태·오류'].map(t=>el('span', {}, t))));
document.body.append(main); footer();
function draw(f){
  seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.id===f.id));
  ucs.replaceChildren('유스케이스 ', ids(f.usecases));
  const pos = {}; let maxC=0,maxR=0;
  for (const n of f.nodes){ pos[n.id] = {x:P+n.col*GX+W/2, y:P+n.row*GY+H/2, n}; maxC=Math.max(maxC,n.col); maxR=Math.max(maxR,n.row); }
  const svg = el('svg:svg', {width:P*2+maxC*GX+W, height:P*2+maxR*GY+H, role:'img'});
  svg.append(el('svg:defs', {}, el('svg:marker', {id:'arr', viewBox:'0 0 10 10', refX:9, refY:5, markerWidth:7, markerHeight:7, orient:'auto-start-reverse'},
    el('svg:path', {d:'M0,0 L10,5 L0,10 z', style:'fill:var(--faint)'}))));
  const term = n => n.type==='start' || n.type==='end';
  const hw = n => n.type==='decision' ? 62 : term(n) ? 60 : W/2, hh = n => n.type==='decision' ? 30 : term(n) ? 17 : n.type==='state' ? H/2-6 : H/2;
  const labels = [];
  for (const e of f.edges){
    const a = pos[e.from], b = pos[e.to]; let d, lx, ly;
    if (a.y === b.y){ const s = Math.sign(b.x-a.x); d = 'M'+(a.x+s*hw(a.n))+','+a.y+' L'+(b.x-s*hw(b.n))+','+b.y; lx=(a.x+b.x)/2; ly=a.y-8; }
    else if (a.x === b.x){ const s = Math.sign(b.y-a.y); d = 'M'+a.x+','+(a.y+s*hh(a.n))+' L'+b.x+','+(b.y-s*hh(b.n)); lx=a.x+6; ly=(a.y+b.y)/2+4; }
    else if (e.route === 'vh'){ const sy=Math.sign(b.y-a.y), sx=Math.sign(b.x-a.x); d='M'+a.x+','+(a.y+sy*hh(a.n))+' L'+a.x+','+b.y+' L'+(b.x-sx*hw(b.n))+','+b.y; lx=a.x+6; ly=(a.y+b.y)/2; }
    else { const sx=Math.sign(b.x-a.x), sy=Math.sign(b.y-a.y); d='M'+(a.x+sx*hw(a.n))+','+a.y+' L'+b.x+','+a.y+' L'+b.x+','+(b.y-sy*hh(b.n)); lx=(a.x+b.x)/2; ly=a.y-8; }
    svg.append(el('svg:path', {class:'edge', d, 'marker-end':'url(#arr)'}));
    if (e.label) labels.push([lx, ly, e.label]);
  }
  for (const {x,y,n} of Object.values(pos)){
    let g;
    if (n.type==='screen'){
      g = el('svg:a', {href:hrefFor(n.screen), class:'n-screen' + (DATA.status && DATA.status[n.screen] ? ' st-' + DATA.status[n.screen] : '')},
        el('svg:rect', {x:x-W/2, y:y-H/2, width:W, height:H, rx:8}),
        el('svg:text', {x, y:y-4, 'text-anchor':'middle', style:'font-size:10px;fill:var(--accent);font-weight:600'}, n.screen),
        el('svg:text', {x, y:y+13, 'text-anchor':'middle', style:'font-size:13px'}, n.label));
    } else if (n.type==='decision'){
      g = el('svg:g', {class:'n-decision'}, el('svg:polygon', {points:[[x,y-30],[x+62,y],[x,y+30],[x-62,y]].map(p=>p.join(',')).join(' ')}),
        el('svg:text', {x, y:y+4, 'text-anchor':'middle', style:'font-size:12px'}, n.label));
    } else if (n.type==='state'){
      g = el('svg:g', {class:'n-state'}, el('svg:rect', {x:x-W/2, y:y-H/2+6, width:W, height:H-12, rx:6}),
        el('svg:text', {x, y:y+4, 'text-anchor':'middle', style:'font-size:12px'}, n.label));
    } else {
      g = el('svg:g', {class:'n-term'}, el('svg:rect', {x:x-60, y:y-17, width:120, height:34, rx:17}),
        el('svg:text', {x, y:y+4, 'text-anchor':'middle', style:'font-size:12px;font-weight:600'}, n.label));
    }
    svg.append(g);
  }
  for (const [lx,ly,t] of labels){
    const w = t.length*11+10;
    svg.append(el('svg:rect', {class:'elabel-bg', x:lx-w/2, y:ly-11, width:w, height:15, rx:4}), el('svg:text', {class:'elabel', x:lx, y:ly, 'text-anchor':'middle'}, t));
  }
  canvas.replaceChildren(svg);
}
DATA.flows.forEach(f => seg.append(el('button', {'data-id':f.id, onclick:()=>{ draw(f); history.replaceState(null,'','#'+f.id); }}, f.id + ' ' + f.name)));
draw(DATA.flows.find(f=>f.id===location.hash.slice(1)) || DATA.flows[0]);
</script>
</body>
</html>
