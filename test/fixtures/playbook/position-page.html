<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>위치 대응 가상 페이지</title>
<style>

#b{position:absolute;left:50%;top:10%;width:20%;height:5%;background:#dec}

<body><p id="a">가</p><p id="b">나</p><div id="c">다</div><div id="fixed">고정 폭</div><table><tbody><tr><td class="owner">값-자리표시</td></tr></tbody></table></body></html>
