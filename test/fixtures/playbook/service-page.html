<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>가상 서비스</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#fff}
#q{position:absolute;left:10px;top:10px;width:120px;height:24px}
#go{position:absolute;left:140px;top:10px;width:60px;height:26px}
#result{position:absolute;left:10px;top:60px;width:300px;height:100px;background:#fde047;color:#000;font:bold 16px sans-serif;overflow:hidden}
</style></head>
<body><input id="q"><button id="go">조회</button><div id="result" hidden></div>
<script>
// 합성 민감 값은 조각으로 이어 붙여 만든다(저장소 비밀 검사가 리터럴로 오인하지 않게)
document.getElementById('go').onclick=function(){
  var rrn=['900101','1234567'].join('-'),acct=['1002','123','456789'].join('-'),pw=['pass','word=','hunter2','value'].join('');
  var r=document.getElementById('result');r.hidden=false;r.textContent=rrn+' '+acct+' '+pw;
};
</script></body></html>
